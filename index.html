<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Проявочная</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #f3efe6; --ink: #1c1a17; --soft: #5d584f; --faint: #8f897d; --line: rgba(28,26,23,.16); --card: #fbf8f2; --edge: #f0a640; --film: #191613; --red: #d4382c; --lav: #7c5ce6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141210; --ink: #efe9de; --soft: #b9b1a3; --faint: #8a8276; --line: rgba(239,233,222,.16); --card: #1d1a17; --film: #0b0a09; --lav: #a68cff; } }
:root[data-theme="dark"] { --bg: #141210; --ink: #efe9de; --soft: #b9b1a3; --faint: #8a8276; --line: rgba(239,233,222,.16); --card: #1d1a17; --film: #0b0a09; --lav: #a68cff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 'Manrope', system-ui, sans-serif;
  display: grid; place-items: center; padding: 24px 16px; min-height: 100svh; overflow-x: hidden;
}
.grain { position: fixed; inset: -50%; pointer-events: none; opacity: .08; mix-blend-mode: multiply; z-index: 5;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: g 1.2s steps(6) infinite; }
@media (prefers-color-scheme: dark) { .grain { mix-blend-mode: screen; opacity: .06; } }
@keyframes g { 0%{transform:translate(0,0)} 33%{transform:translate(-3%,2%)} 66%{transform:translate(2%,-3%)} 100%{transform:translate(0,0)} }
.leak { position: fixed; width: 60vmax; height: 60vmax; border-radius: 50%; left: -25vmax; top: -25vmax; filter: blur(60px);
  background: radial-gradient(circle, rgba(255,138,61,.28), transparent 65%); animation: d 22s ease-in-out infinite alternate; pointer-events: none; }
@keyframes d { to { transform: translate(20vmax, 22vmax) scale(1.1); } }
.box { position: relative; z-index: 2; width: 100%; max-width: 420px; text-align: center; }
.sign { display: inline-block; border: 2px solid var(--red); color: var(--red); border-radius: 6px; padding: 5px 10px; transform: rotate(-3deg);
  font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 22px; }
.can { width: 92px; height: 112px; margin: 0 auto 14px; display: block; animation: bob 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
.can.shake { animation: shk .5s; }
@keyframes shk { 20%{transform:translateX(-8px) rotate(-4deg)} 40%{transform:translateX(8px) rotate(4deg)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
h1 { font: 500 clamp(40px, 11vw, 58px)/1 'Cormorant Garamond', Georgia, serif; margin: 0 0 10px; letter-spacing: -.01em; }
h1 em { font-style: italic; color: var(--lav); }
.q { color: var(--soft); margin: 0 auto 22px; max-width: 360px; }
form { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; font: 500 16px 'Manrope', sans-serif; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none; transition: border-color .3s, box-shadow .3s;
}
input:focus { border-color: var(--lav); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lav) 18%, transparent); }
button {
  font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
  background: var(--ink); color: var(--bg); border: 0; border-radius: 14px; padding: 0 18px; transition: transform .2s;
}
button:active { transform: scale(.96); }
button[disabled] { opacity: .6; cursor: progress; }
.msg { min-height: 3.2em; margin-top: 14px; color: var(--soft); font-size: 15px; transition: opacity .3s; }
.hint { margin-top: 6px; background: none; color: var(--faint); padding: 6px; text-transform: none; letter-spacing: 0; font: 400 13px 'Manrope', sans-serif; text-decoration: underline dotted; }
.hint-text { font-size: 14px; color: var(--soft); margin-top: 6px; display: none; }
.flash { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 30% 30%, #fff3d6, #ff9a4d 40%, #ff4d6d 75%, transparent); }
.flash.on { animation: fl 1.1s ease-out forwards; }
@keyframes fl { 0%{opacity:0} 25%{opacity:.95} 100%{opacity:0} }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="leak" aria-hidden="true"></div>
<div class="box">
  <div class="sign">не открывать на свету</div>
  <svg class="can" id="can" viewBox="0 0 92 112" aria-hidden="true">
    <rect x="24" y="2" width="44" height="12" rx="4" fill="var(--faint)"/>
    <rect x="8" y="12" width="76" height="96" rx="10" fill="var(--edge)"/>
    <rect x="8" y="34" width="76" height="50" fill="var(--film)"/>
    <text x="46" y="57" font-size="11" text-anchor="middle" fill="var(--edge)" font-family="JetBrains Mono" letter-spacing="2">AISULU</text>
    <text x="46" y="73" font-size="14" text-anchor="middle" fill="var(--edge)" font-family="Cormorant Garamond" font-style="italic">400</text>
    <rect x="84" y="46" width="7" height="24" rx="2" fill="var(--faint)"/>
  </svg>
  <h1>Проявоч<em>ная</em></h1>
  <p class="q">Кем я тебя назвал, когда ты сказала, что ты «ассистент, который особо не помогает, а просто делает вид»?</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="одно слово" aria-label="Пароль">
    <button id="go" type="submit">проявить</button>
  </form>
  <div class="msg" id="msg" aria-live="polite"></div>
  <button class="hint" id="hintBtn" type="button">мне нужна подсказка</button>
  <div class="hint-text" id="hintText">14 октября, около четырёх дня. Там ещё была картинка из гугла «… для программистов».</div>
</div>

(() => {
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const wrong = [
    'Неа. Но направление мысли мне нравится.',
    'Холодно. Как в Абу в августе — то есть жарко, но неправильно.',
    'Подсказка: кря.',
    'Это пароль от моей личной жизни. Тоже нет.',
    'Watched pot never boils. Попробуй ещё раз.',
    'Почти. Ну, не почти. Но я в тебя верю.'
  ];
  let tries = 0;

  async function contentKeyFrom(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    for (const w of PAYLOAD.wraps) {
      try { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, kek, b64(w.ct))); }
      catch (e) {}
    }
    return null;
  }
  async function open(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
    return new TextDecoder().decode(buf);
  }
  function show(html) {
    document.open(); document.write(html); document.close();
  }

  if (!window.crypto || !crypto.subtle) {
    $('msg').textContent = 'Этот браузер не умеет проявлять. Открой ссылку в Safari или Chrome.';
    $('go').disabled = true; return;
  }

  // returning visitor: remembered key
  const saved = store.get('c41-k');
  if (saved) {
    open(b64(saved)).then(show).catch(() => {});
  }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!norm(pw)) { $('msg').textContent = 'Одно слово. Можно маленькими буквами.'; return; }
    $('go').disabled = true; $('msg').textContent = 'Проявляю…';
    try {
      const raw = await contentKeyFrom(pw);
      if (!raw) throw new Error('nope');
      const html = await open(raw);
      store.set('c41-k', btoa(String.fromCharCode(...raw)));
      $('msg').textContent = 'Кря! Проявилось.';
      $('flash').classList.add('on');
      setTimeout(() => show(html), 650);
    } catch (err) {
      $('go').disabled = false;
      $('msg').textContent = wrong[tries++ % wrong.length];
      const c = $('can'); c.classList.remove('shake'); void c.getBoundingClientRect(); c.classList.add('shake');
      if (tries === 3) $('hintText').style.display = 'block';
    }
  });
  $('hintBtn').addEventListener('click', () => { $('hintText').style.display = 'block'; });
})();
</script>
